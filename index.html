<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Together!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/gladriel" rel="stylesheet">
    </head>

    <body>

    <div id="timer-message">Please select a timer before starting.</div>

    <div class="container">
        <div class="timer">
            <h1>STUDY ROOM!</h1>

            <div class="button-container">
                <button class="button" id="pomodoro-session">Pomodoro</button>
                <button class="button" id="short-break">Short Break</button>
                <button class="button" id="long-break">Long Break</button>
            </div>

            <main>

                        <div class="pomodoro">
                            <div id="pomodoro-timer" class="timer-display" data-duration="25.00">
                                <h1 class="time">25:00</h1>
                            </div>
                            <div id="short-timer" class="timer-display" data-duration="5.00">
                                <h1 class="time">5:00</h1>
                            </div>

                            <div id="long-timer" class="timer-display" data-duration="10.00">
                                <h1 class="time">10:00</h1>
                            </div>
                        </div>

                
            </main>

            <div id="container">
                <div id="card">
                     <div id="myDIV" class="header">
                        <h2>My To Do List</h2>
                        <input type="text" id="myInput" placeholder="Title...">
                        <span onclick="newElement()" class="addBtn">Add</span>
                    </div>
                        <ul id="myUL">
                        <li>Give gift to Aster</li>
                        <li class="checked">Your Mom</li>
                        </ul> 
                </div>
            </div>



            <div class="buttons">
                <button id="start">START</button>
                <button id="stop">STOP</button>
            </div>
            <div class="buttons">   <!-- will add more pages later -->
                <button id="ChangeTheme">Change theme</button>
                <button id="Avatar">Avatar</button>

            </div>
        </div>
    </div>
    <script src="script.js"></script>
    </body>

</html>
